<!DOCTYPE html>
<html>
<head></head>
<body>
  <div id="d"></div>
  <div id="l"></div>
  <script>
    async function run() {
      const darkSvg = await (await fetch('public/irken-logo-dark.svg')).text();
      const lightSvg = await (await fetch('public/irken-logo-light.svg')).text();
      
      document.getElementById('d').innerHTML = darkSvg;
      document.getElementById('l').innerHTML = lightSvg;

      const dSvg = document.querySelector('#d svg');
      const lSvg = document.querySelector('#l svg');

      // Get bbox of the visible groups
      // In dSvg, the main group is the child g
      const dG = dSvg.querySelector('g[transform]');
      const lG = lSvg.querySelector('g[clip-path]');

      console.log('DARK BBOX:', JSON.stringify(dG.getBBox()));
      console.log('LIGHT BBOX:', JSON.stringify(lG.getBBox()));
    }
    run();
  </script>
</body>
</html>
